<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>IPTV Live</title>
<link rel="icon" href="/img/favicon.ico">
<!-- hls.js：本地加载，项目不使用任何外部链接 -->
<script src="/js/hls.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #1a1a2e; color: #e0e0e0;
  height: 100vh;      /* 老浏览器回退 */
  height: 100dvh;     /* 移动端 Chrome/Safari 动态视口，工具栏显隐时自动适配 */
  display: flex; overflow: hidden;
}
/* ===== 侧边栏 ===== */
#sidebar {
  width: clamp(220px, 30vw, 280px); min-width: clamp(220px, 30vw, 280px); background: #16213e; display: flex; flex-direction: column;
  border-right: 1px solid #0f3460; transition: margin-left .3s ease, min-width .3s ease, width .3s ease;
  z-index: 10;
}
#sidebar.collapsed { margin-left: calc(-1 * clamp(220px, 30vw, 280px)); }
.sidebar-header {
  padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #0f3460; background: #0f3460;
}
.sidebar-header h1 { font-size: 16px; font-weight: 600; color: #e94560; letter-spacing: 1px; }
#toggle-sidebar {
  background: none; border: none; color: #a0a0c0; font-size: 18px; cursor: pointer; padding: 4px 8px;
  border-radius: 4px;
}
#toggle-sidebar:hover { background: rgba(255,255,255,.1); color: #fff; }
.sidebar-section { padding: 10px 12px; border-bottom: 1px solid rgba(15,52,96,.5); }
.url-row { display: flex; gap: 6px; }
.url-row input {
  flex: 1; min-width: 0; padding: 8px 10px; background: #1a1a2e; border: 1px solid #0f3460;
  border-radius: 6px; color: #e0e0e0; font-size: 13px; outline: none;
}
.url-row input:focus { border-color: #e94560; }
.btn {
  padding: clamp(4px, 1.5vw, 8px) clamp(8px, 2.5vw, 14px); background: #e94560; color: #fff; border: none; border-radius: 6px;
  font-size: clamp(11px, 1.8vw, 13px); cursor: pointer; white-space: nowrap; transition: background .2s;
}
.btn:hover { background: #c73652; }
.btn:disabled { background: #555; cursor: not-allowed; }
.btn-secondary { background: #0f3460; }
.btn-secondary:hover { background: #1a4a7a; }
.file-label {
  display: block; text-align: center; padding: clamp(4px, 1.2vw, 7px); margin-top: 8px; background: #0f3460;
  border-radius: 6px; font-size: clamp(10px, 1.6vw, 12px); color: #a0c0e0; cursor: pointer; transition: background .2s;
}
.file-label:hover { background: #1a4a7a; }
/* 播放列表快速选择（服务端配置 + 用户自定义） */
.playlists { margin-bottom: 10px; }
.playlists .playlists-title { font-size: 12px; color: #7a7a9a; margin-bottom: 6px; }
.playlists .playlists-list { display: flex; flex-wrap: wrap; gap: 6px; }
.playlist-btn {
  padding: clamp(3px, 1vw, 5px) clamp(6px, 2vw, 10px); background: #0f3460; color: #a0c0e0; border: 1px solid #1a4a7a;
  border-radius: 14px; font-size: clamp(10px, 1.6vw, 12px); cursor: pointer; white-space: nowrap;
  transition: background .2s, color .2s, border-color .2s;
}
.playlist-btn:hover { background: #1a4a7a; color: #fff; }
.playlist-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
.playlist-item { display: inline-flex; align-items: center; }
.playlist-del {
  margin-left: 4px; padding: 1px 5px; font-size: 11px; line-height: 1.4;
  background: transparent; border: 1px solid #3a3a5a; border-radius: 4px;
  color: #7a7a9a; cursor: pointer; vertical-align: middle;
}
.playlist-del:hover { background: #e94560; border-color: #e94560; color: #fff; }
.sidebar-section input[type="text"], .sidebar-section select {
  width: 100%; padding: clamp(5px, 1.5vw, 8px) clamp(6px, 2vw, 10px); background: #1a1a2e; border: 1px solid #0f3460;
  border-radius: 6px; color: #e0e0e0; font-size: clamp(11px, 1.8vw, 13px); outline: none; margin-bottom: 8px;
}
.sidebar-section input[type="text"]:focus, .sidebar-section select:focus { border-color: #e94560; }
.sidebar-section select option { background: #1a1a2e; }
#channel-count { padding: 8px 12px; font-size: 12px; color: #7a7a9a; border-bottom: 1px solid rgba(15,52,96,.5); }
#channel-count .playlist-name { color: #a0c0e0; }
/* ===== 频道列表 ===== */
#channel-list { flex: 1; overflow-y: auto; list-style: none; }
#channel-list::-webkit-scrollbar { width: 6px; }
#channel-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
.channel-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer;
  transition: background .15s; border-left: 3px solid transparent;
}
.channel-item:hover { background: rgba(15,52,96,.6); }
.channel-item.active { background: rgba(233,69,96,.15); border-left-color: #e94560; }
.channel-logo {
  width: 40px; height: 40px; min-width: 40px; border-radius: 6px; background: #000;
  object-fit: contain; display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #555;
}
.channel-info { flex: 1; min-width: 0; }
.channel-name {
  font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d0d0e0;
}
.channel-item.active .channel-name { color: #e94560; font-weight: 600; }
.channel-group { font-size: 11px; color: #6a6a8a; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-tip { padding: 30px 16px; text-align: center; color: #555; font-size: 13px; }
/* ===== 主区域 ===== */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#sidebar-toggle-float {
  position: absolute; top: 10px; left: 10px; z-index: 20; background: rgba(15,52,96,.85);
  border: none; color: #fff; font-size: 16px; padding: 6px 10px; border-radius: 6px;
  cursor: pointer; display: none; backdrop-filter: blur(4px);
}
#sidebar-toggle-float:hover { background: #e94560; }
#player-area { flex: 1; background: #000; position: relative; overflow: hidden; }
#video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
#channel-name-overlay {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.65); color: #fff; padding: 6px 18px; border-radius: 20px;
  font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .3s;
  backdrop-filter: blur(4px); white-space: nowrap; max-width: 80%; overflow: hidden;
  text-overflow: ellipsis;
}
#channel-name-overlay.show { opacity: 1; }
/* ===== 自建直播控制条 ===== */
#player-controls {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  z-index: 15; transition: opacity .3s;
}
#player-controls.hidden-controls { opacity: 0; pointer-events: none; }
#player-controls button {
  background: none; border: none; color: #fff; cursor: pointer;
  font-size: clamp(14px, 2vw, 18px); padding: 4px 6px; line-height: 1;
  transition: color .2s;
}
#player-controls button:hover { color: #e94560; }
#volume-slider { width: clamp(60px, 10vw, 100px); accent-color: #e94560; cursor: pointer; }
#live-badge {
  margin-left: auto; background: #e94560; color: #fff;
  font-size: clamp(9px, 1.2vw, 11px); padding: 2px 8px; border-radius: 10px;
  font-weight: 600; letter-spacing: 1px; user-select: none; white-space: nowrap;
}
#btn-aspect { margin-left: auto; font-size: clamp(11px, 1.6vw, 13px); }
.status-loading { color: #e94560; }
.status-error { color: #ff0000; }
.status-ok { color: #51cf66; }
/* ===== 移动端 ===== */
@media (max-width: 768px) {
  #sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; box-shadow: 4px 0 20px rgba(0,0,0,.5);
  }
  #sidebar.collapsed { margin-left: calc(-1 * clamp(220px, 30vw, 280px)); }
  #sidebar-toggle-float { display: block; }
  #channel-name-overlay { font-size: 12px; top: 50px; }
  /* 触摸友好：增大频道项点击区域，缩小缩略图与字体 */
  .channel-item { padding: 12px 14px; }
  .channel-logo { width: 36px; height: 36px; min-width: 36px; }
  .channel-name { font-size: 12px; }
  /* 按钮进一步缩小 */
  .btn { padding: 4px 10px; font-size: 12px; }
  .playlist-btn { padding: 3px 8px; font-size: 11px; }
  .file-label { padding: 5px; font-size: 11px; }
  .sidebar-section input[type="text"], .sidebar-section select { padding: 6px 8px; font-size: 12px; }
  /* 播放列表胶囊按钮确保可换行 */
  .playlists .playlists-list { flex-wrap: wrap; }
  /* 播放器控制条触摸友好：增大按钮触摸区域(约44px)，aspect 按钮更醒目易发现 */
  #player-controls { padding: 10px 12px; gap: 4px; }
  #player-controls button { padding: 14px 12px; font-size: 16px; }
  #btn-aspect { font-size: 14px; min-width: 56px; text-align: center; }
  #volume-slider { width: 72px; }
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-header">
    <h1>IPTV Live</h1>
    <button id="toggle-sidebar" title="收起侧边栏">☰</button>
  </div>
  <div class="sidebar-section">
    <div id="playlists" class="playlists" hidden></div>
    <div class="url-row">
      <input type="text" id="url-input" placeholder="播放列表 URL">
      <button class="btn" id="load-btn">加载</button>
    </div>
    <label class="file-label" for="file-input">📂 上传本地播放列表 (.m3u / .m3u8)</label>
    <input type="file" id="file-input" accept=".m3u,.m3u8" hidden>
  </div>
  <div class="sidebar-section">
    <input type="text" id="search-input" placeholder="🔍 搜索频道...">
    <select id="group-select">
      <option value="">全部分组</option>
    </select>
  </div>
  <div id="channel-count">共 0 个频道</div>
  <ul id="channel-list">
    <li class="empty-tip">输入播放列表URL并点击加载</li>
  </ul>
</aside>

<main id="main">
  <button id="sidebar-toggle-float" title="展开侧边栏">☰</button>
  <div id="player-area">
    <video id="video" autoplay playsinline></video>
    <div id="channel-name-overlay"></div>
    <div id="player-controls">
      <button id="btn-play" title="播放/暂停">▶</button>
      <button id="btn-mute" title="静音/取消静音">🔊</button>
      <input type="range" id="volume-slider" min="0" max="100" value="100" title="音量">
      <span id="live-badge">LIVE</span>
      <button id="btn-aspect" title="画面比例">铺满</button>
      <button id="btn-fullscreen" title="全屏">⛶</button>
    </div>
  </div>
</main>

<script>
(function() {
  'use strict';

  var PROXY_PREFIX = '/proxy?url=';

  // DOM
  var sidebar = document.getElementById('sidebar');
  var toggleSidebar = document.getElementById('toggle-sidebar');
  var toggleFloat = document.getElementById('sidebar-toggle-float');
  var playlistWrap = document.getElementById('playlists');
  var urlInput = document.getElementById('url-input');
  var loadBtn = document.getElementById('load-btn');
  var fileInput = document.getElementById('file-input');
  var searchInput = document.getElementById('search-input');
  var groupSelect = document.getElementById('group-select');
  var channelList = document.getElementById('channel-list');
  var channelCount = document.getElementById('channel-count');
  var video = document.getElementById('video');
  var channelNameOverlay = document.getElementById('channel-name-overlay');

  // 状态
  var allChannels = [];
  var currentChannel = null;
  var hls = null;
  var overlayTimer = null;
  var statusTimer = null;
  var serverPlaylists = [];
  // 用户自定义播放列表（浏览器 localStorage 持久化，与服务端列表合并显示）
  var customPlaylists = [];
  try {
    customPlaylists = JSON.parse(localStorage.getItem('iptv-custom-playlists') || '[]');
    if (!Array.isArray(customPlaylists)) customPlaylists = [];
  } catch(e) { customPlaylists = []; }
  var currentPlaylistName = '';

  /* ===== 工具函数 ===== */
  function proxyUrl(u) {
    if (!u) return '';
    if (u.indexOf('/proxy?url=') === 0) return u;
    if (u.indexOf(location.origin + '/proxy') === 0) return u;
    return PROXY_PREFIX + encodeURIComponent(u);
  }

  // 根据 URL 匹配播放列表名称（服务端+自定义），未匹配返回空字符串
  function matchPlaylistName(url) {
    if (!url) return '';
    var all = serverPlaylists.concat(customPlaylists);
    for (var i = 0; i < all.length; i++) {
      if (all[i].url === url) return all[i].name;
    }
    return '';
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function showChannelCount() {
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    var list = getFilteredChannels();
    var countText = '共 ' + list.length + ' / ' + allChannels.length + ' 个频道';
    if (currentPlaylistName) {
      channelCount.innerHTML = '<span class="playlist-name">' + escapeHtml(currentPlaylistName) + '</span> · ' + countText;
    } else {
      channelCount.textContent = countText;
    }
    channelCount.className = '';
  }

  function setStatus(msg, type) {
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    channelCount.textContent = msg;
    channelCount.className = type || '';
    // 错误/成功状态显示一段时间后恢复为频道数量
    if (type === 'status-error' || type === 'status-ok') {
      statusTimer = setTimeout(showChannelCount, 4000);
    }
  }

  function getDomain(u) {
    try { return new URL(u).hostname; } catch(e) { return u; }
  }

  function showChannelName(name) {
    channelNameOverlay.textContent = name;
    channelNameOverlay.classList.add('show');
    if (overlayTimer) clearTimeout(overlayTimer);
    overlayTimer = setTimeout(function() {
      channelNameOverlay.classList.remove('show');
    }, 4000);
  }

  /* ===== M3U 解析 ===== */
  function parseM3U(text) {
    var channels = [];
    var lines = text.split(/\r?\n/);
    var pending = null;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      if (line.charAt(0) === '#') {
        if (line.indexOf('#EXTINF') === 0) {
          pending = parseExtInf(line);
        }
        continue;
      }
      // URL 行
      var ch = pending || {
        name: getDomain(line), tvgId: '', tvgName: '', logo: '', group: '未分组', url: ''
      };
      ch.url = line;
      if (!ch.name) ch.name = getDomain(line);
      channels.push(ch);
      pending = null;
    }
    return channels;
  }

  function parseExtInf(line) {
    var commaIdx = line.indexOf(',');
    var name = commaIdx >= 0 ? line.substring(commaIdx + 1).trim() : '';
    var attrPart = commaIdx >= 0 ? line.substring(0, commaIdx) : line;
    function attr(key) {
      var m = attrPart.match(new RegExp(key + '="([^"]*)"'));
      return m ? m[1] : '';
    }
    return {
      name: name || '未知频道',
      tvgId: attr('tvg-id'),
      tvgName: attr('tvg-name'),
      logo: attr('tvg-logo'),
      group: attr('group-title') || '未分组',
      url: ''
    };
  }

  /* ===== 加载播放列表 ===== */
  function loadPlaylistFromUrl(url, name) {
    if (!url) return;
    // 未传 name 时（如 URL 输入框加载），尝试匹配播放列表名称
    if (!name) name = matchPlaylistName(url);
    setStatus('正在加载播放列表...', 'status-loading');
    loadBtn.disabled = true;
    fetch(proxyUrl(url))
      .then(function(resp) {
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.text();
      })
      .then(function(text) {
        var channels = parseM3U(text);
        if (channels.length === 0) throw new Error('未解析到任何频道');
        allChannels = channels;
        currentPlaylistName = name || '';
        buildGroupSelect();
        renderChannelList();
        setStatus('已加载 ' + channels.length + ' 个频道', 'status-ok');
        try { localStorage.setItem('iptv-playlist-url', url); } catch(e) {}
        addCustomPlaylist(url);
        renderPlaylists();
        setActivePlaylistBtn(url);
      })
      .catch(function(err) {
        setStatus('加载失败: ' + err.message, 'status-error');
      })
      .finally(function() { loadBtn.disabled = false; });
  }

  function loadPlaylistFromFile(file) {
    setStatus('正在读取文件...', 'status-loading');
    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      var channels = parseM3U(text);
      if (channels.length === 0) {
        setStatus('文件中未解析到频道', 'status-error');
        return;
      }
      var key = 'local://' + Date.now();
      var name = (file && file.name) ? file.name.replace(/\.(m3u8?|txt)$/i, '') : '本地文件';
      allChannels = channels;
      currentPlaylistName = name;
      buildGroupSelect();
      renderChannelList();
      var saved = addCustomPlaylist(key, name, text);
      renderPlaylists();
      setActivePlaylistBtn(key);
      if (saved) {
        try { localStorage.setItem('iptv-playlist-url', key); } catch(e) {}
        setStatus('已从文件加载 ' + channels.length + ' 个频道', 'status-ok');
      } else {
        // 容量不足未能持久化:当前会话可用,刷新后需重新上传
        setStatus('已加载 ' + channels.length + ' 个频道(存储空间不足,未保存)', 'status-ok');
      }
    };
    reader.onerror = function() { setStatus('读取文件失败', 'status-error'); };
    reader.readAsText(file);
  }

  // 加载本地上传的播放列表(从 localStorage 中存储的 M3U 原文解析,无需网络请求)
  function loadPlaylistFromLocal(key, name) {
    var item = null;
    for (var i = 0; i < customPlaylists.length; i++) {
      if (customPlaylists[i].url === key) { item = customPlaylists[i]; break; }
    }
    if (!item || !item.content) {
      setStatus('本地播放列表数据已丢失,请重新上传文件', 'status-error');
      return;
    }
    var channels = parseM3U(item.content);
    if (channels.length === 0) {
      setStatus('未解析到任何频道', 'status-error');
      return;
    }
    allChannels = channels;
    currentPlaylistName = name || item.name;
    buildGroupSelect();
    renderChannelList();
    setStatus('已加载 ' + channels.length + ' 个频道', 'status-ok');
    try { localStorage.setItem('iptv-playlist-url', key); } catch(e) {}
    setActivePlaylistBtn(key);
  }

  /* ===== 分组与渲染 ===== */
  function buildGroupSelect() {
    var groupSet = {};
    for (var i = 0; i < allChannels.length; i++) {
      var g = allChannels[i].group || '未分组';
      groupSet[g] = (groupSet[g] || 0) + 1;
    }
    var groups = Object.keys(groupSet).sort();
    groupSelect.innerHTML = '<option value="">全部分组 (' + allChannels.length + ')</option>';
    for (var j = 0; j < groups.length; j++) {
      var opt = document.createElement('option');
      opt.value = groups[j];
      opt.textContent = groups[j] + ' (' + groupSet[groups[j]] + ')';
      groupSelect.appendChild(opt);
    }
  }

  function getFilteredChannels() {
    var keyword = searchInput.value.trim().toLowerCase();
    var group = groupSelect.value;
    return allChannels.filter(function(ch) {
      if (group && (ch.group || '未分组') !== group) return false;
      if (keyword && ch.name.toLowerCase().indexOf(keyword) === -1) return false;
      return true;
    });
  }

  function renderChannelList() {
    var list = getFilteredChannels();
    showChannelCount();
    channelList.innerHTML = '';
    if (list.length === 0) {
      var tip = document.createElement('li');
      tip.className = 'empty-tip';
      tip.textContent = allChannels.length === 0 ? '请先加载播放列表' : '无匹配频道';
      channelList.appendChild(tip);
      return;
    }
    var frag = document.createDocumentFragment();
    for (var i = 0; i < list.length; i++) {
      (function(ch) {
        var li = document.createElement('li');
        li.className = 'channel-item' + (currentChannel && currentChannel.url === ch.url ? ' active' : '');
        li.setAttribute('data-url', ch.url);

        // logo（有图用img，无图用首字母占位）
        var logoEl;
        if (ch.logo) {
          logoEl = document.createElement('img');
          logoEl.className = 'channel-logo';
          logoEl.loading = 'lazy';
          logoEl.alt = '';
          logoEl.src = ch.logo;
          logoEl.onerror = function() {
            var fb = document.createElement('span');
            fb.className = 'channel-logo';
            fb.textContent = ch.name.charAt(0) || '?';
            logoEl.replaceWith(fb);
          };
        } else {
          logoEl = document.createElement('span');
          logoEl.className = 'channel-logo';
          logoEl.textContent = ch.name.charAt(0) || '?';
        }
        li.appendChild(logoEl);

        // 频道信息
        var info = document.createElement('div');
        info.className = 'channel-info';
        var nm = document.createElement('div');
        nm.className = 'channel-name';
        nm.textContent = ch.name;
        var gp = document.createElement('div');
        gp.className = 'channel-group';
        gp.textContent = ch.group || '未分组';
        info.appendChild(nm);
        info.appendChild(gp);
        li.appendChild(info);

        li.addEventListener('click', function() { playChannel(ch); });
        frag.appendChild(li);
      })(list[i]);
    }
    channelList.appendChild(frag);
  }

  // 移动端检测（HLS 配置与控制条隐藏均需使用，需在 playChannel 定义前声明）
  var isMobile = window.matchMedia('(max-width: 768px)').matches || window.innerWidth <= 768;

  /* ===== 播放 ===== */
  function destroyHls() {
    if (hls) { try { hls.destroy(); } catch(e) {} hls = null; }
  }

  function playChannel(ch) {
    currentChannel = ch;
    destroyHls();
    var streamUrl = proxyUrl(ch.url);
    showChannelName(ch.name);
    setStatus('正在连接: ' + ch.name, 'status-loading');

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({
        liveSyncDurationCount: 5,                // 播放点距直播边缘5个分片，给首片冷启动下载留余量
        liveMaxLatencyDurationCount: 10,         // 最大延迟10个分片，落后5~10片之间用1.5倍速平滑追赶，超10片才seek
        enableWorker: true,                      // Web Worker 解复用，减轻主线程压力，避免移动端软解闪烁掉帧
        maxBufferLength: isMobile ? 30 : 60,     // 前向缓冲：移动端30秒/桌面端60秒，过大易致 SourceBuffer 溢出花屏
        maxMaxBufferLength: isMobile ? 60 : 120, // 缓冲上限：移动端60秒/桌面端120秒，防止内存过度增长
        capLevelToPlayerSize: true,              // 按播放器实际尺寸限制码率层级，避免移动端硬解超高清流花屏失真
        startLevel: isMobile ? 0 : -1,           // 起播码率：移动端从最低码率起播(0)，桌面端自动选择(-1)
        abrEwmaDefaultEstimate: 500000,          // 初始带宽估计500kbps，保守起播避免直接拉高码率
        abrBandWidthFactor: 0.95,                // ABR带宽安全系数，减少码率频繁切换
        abrBandWidthUpFactor: 0.7,               // 升级码率更保守，避免频繁升降导致SPS/PPS切换花屏
        manifestLoadingTimeOut: 30000,           // manifest加载超时从10秒延长到30秒
        manifestLoadingMaxRetry: 6,              // manifest重试从2次增加到6次
        manifestLoadingRetryDelay: 1000,         // manifest重试间隔1秒
        levelLoadingTimeOut: 30000,              // 级别加载超时从10秒延长到30秒
        levelLoadingMaxRetry: 6,                 // 级别加载重试6次
        levelLoadingRetryDelay: 1000,            // 级别加载重试间隔1秒
        fragLoadingTimeOut: 60000,               // 分片加载超时从20秒延长到60秒
        fragLoadingMaxRetry: 10,                 // 分片加载重试10次，弱网兜底
        fragLoadingRetryDelay: 500,              // 分片重试间隔500ms
        maxLiveSyncPlaybackRate: 1.5,            // 落后直播边缘时以1.5倍速平滑追赶，避免直接seek跳转造成画面跳跃
        startFragPrefetch: true,                 // manifest解析后立即预取首片，配合延迟起播策略尽早开始下载
        liveDurationInfinity: true               // 直播场景 MediaSource duration 设为 Infinity，避免 seek 越界
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      // 起播缓冲标志：每次切换频道需重置，确保新频道也等缓冲够再起播
      var playbackStarted = false;
      var bufferedFragCount = 0;             // 已缓冲分片计数：缓冲2片(约4~10秒)再起播，比1片更抗网络抖动，彻底避免"起播即卡"
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        setStatus('缓冲中: ' + ch.name, 'status-loading');
        // 不立即 play：零缓冲起播会卡住，卡住期间落后直播边缘触发 seek 跳转；等 FRAG_BUFFERED 缓冲满2片后再播
      });
      hls.on(Hls.Events.FRAG_BUFFERED, function() {
        if (!playbackStarted) {
          bufferedFragCount++;
          if (bufferedFragCount >= 2) {
            playbackStarted = true;
            setStatus('正在播放: ' + ch.name, 'status-ok');
            video.play().catch(function() {});
          }
        }
      });
      hls.on(Hls.Events.ERROR, function(evt, data) {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          setStatus('网络错误，尝试恢复: ' + data.details, 'status-error');
          hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          setStatus('媒体错误，尝试恢复: ' + data.details, 'status-error');
          hls.recoverMediaError();
        } else {
          setStatus('播放失败: ' + data.details, 'status-error');
          destroyHls();
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari 原生 HLS
      video.src = streamUrl;
      video.play().catch(function() {});
      setStatus('正在播放: ' + ch.name, 'status-ok');
    } else {
      setStatus(window.Hls ? '当前浏览器不支持 HLS 播放' : '视频解码库加载失败，请检查 js/hls.min.js 文件', 'status-error');
    }
    // 更新高亮（仅切换 active 类，不重建列表，避免大量频道时卡顿）
    var items = channelList.querySelectorAll('.channel-item');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', items[i].getAttribute('data-url') === ch.url);
    }
  }

  /* ===== 事件绑定 ===== */
  toggleSidebar.addEventListener('click', function() {
    sidebar.classList.add('collapsed');
    toggleFloat.style.display = 'block';
  });
  toggleFloat.addEventListener('click', function() {
    sidebar.classList.remove('collapsed');
    toggleFloat.style.display = 'none';
  });
  // 移动端小屏幕默认收起侧边栏，直接显示播放器，点击浮动按钮展开列表
  if (window.matchMedia('(max-width: 768px)').matches) {
    sidebar.classList.add('collapsed');
    toggleFloat.style.display = 'block';
  }
  loadBtn.addEventListener('click', function() {
    loadPlaylistFromUrl(urlInput.value.trim());
  });
  urlInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') loadPlaylistFromUrl(urlInput.value.trim());
  });
  fileInput.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (file) loadPlaylistFromFile(file);
    fileInput.value = '';
  });
  searchInput.addEventListener('input', renderChannelList);
  groupSelect.addEventListener('change', renderChannelList);

  /* ===== 自建直播控制条 ===== */
  var playerArea = document.getElementById('player-area');
  var playerControls = document.getElementById('player-controls');
  var btnPlay = document.getElementById('btn-play');
  var btnMute = document.getElementById('btn-mute');
  var volumeSlider = document.getElementById('volume-slider');
  var btnAspect = document.getElementById('btn-aspect');
  var btnFullscreen = document.getElementById('btn-fullscreen');

  // 控制条自动隐藏：鼠标离开播放区域后隐藏（移动端 5 秒，桌面端 3 秒），暂停时始终显示
  var hideControlsDelay = isMobile ? 5000 : 3000;
  var hideControlsTimer = null;
  function hideControls() { playerControls.classList.add('hidden-controls'); }
  function showControls() { playerControls.classList.remove('hidden-controls'); }
  function scheduleHide() {
    if (hideControlsTimer) clearTimeout(hideControlsTimer);
    hideControlsTimer = setTimeout(function() {
      if (!video.paused) hideControls();
    }, hideControlsDelay);
  }
  function showControlsAuto() { showControls(); scheduleHide(); }

  // 播放/暂停：仅按钮触发，点击视频画面不触发任何播放控制
  btnPlay.addEventListener('click', function() {
    if (video.paused) { video.play().catch(function() {}); }
    else { video.pause(); }
  });
  video.addEventListener('play', function() { btnPlay.textContent = '⏸'; scheduleHide(); });
  video.addEventListener('pause', function() {
    btnPlay.textContent = '▶';
    showControls();
    if (hideControlsTimer) { clearTimeout(hideControlsTimer); hideControlsTimer = null; }
  });

  // 静音/音量
  btnMute.addEventListener('click', function() { video.muted = !video.muted; });
  volumeSlider.addEventListener('input', function() {
    video.volume = volumeSlider.value / 100;
    if (video.volume === 0) { video.muted = true; }
    else if (video.muted) { video.muted = false; }
  });
  video.addEventListener('volumechange', function() {
    volumeSlider.value = Math.round(video.volume * 100);
    btnMute.textContent = (video.muted || video.volume === 0) ? '🔇' : '🔊';
  });
  // 初始：有声播放，部分浏览器可能阻止未交互的有声自动播放，用户点击播放按钮即可恢复
  video.muted = false;
  volumeSlider.value = 100;
  btnMute.textContent = (video.muted || video.volume === 0) ? '🔇' : '🔊';

  // 画面比例三态循环：适应(contain) → 铺满(cover) → 拉伸(fill)
  var aspectModes = [
    { name: '适应', value: 'contain' },
    { name: '铺满', value: 'cover' },
    { name: '拉伸', value: 'fill' }
  ];
  var aspectIndex = isMobile ? 0 : 1; // 移动端默认适应(contain)，桌面端默认铺满(cover)
  function applyAspect() {
    video.style.objectFit = aspectModes[aspectIndex].value;
    btnAspect.textContent = aspectModes[aspectIndex].name;
  }
  applyAspect();
  btnAspect.addEventListener('click', function() {
    aspectIndex = (aspectIndex + 1) % aspectModes.length;
    applyAspect();
  });

  // 全屏（兼容 Safari webkit 前缀与 iOS video 原生全屏）
  btnFullscreen.addEventListener('click', function() {
    var p;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (video.webkitExitFullscreen) video.webkitExitFullscreen();
    } else if (playerArea.requestFullscreen) {
      p = playerArea.requestFullscreen();
      if (p && p.catch) p.catch(function() {});
    } else if (playerArea.webkitRequestFullscreen) {
      playerArea.webkitRequestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    } else if (video.requestFullscreen) {
      p = video.requestFullscreen();
      if (p && p.catch) p.catch(function() {});
    } else if (video.webkitRequestFullscreen) {
      video.webkitRequestFullscreen();
    }
  });
  function onFullscreenChange() {
    var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || video.webkitDisplayingFullscreen);
    btnFullscreen.textContent = isFs ? '⤢' : '⛶';
  }
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);
  // iOS video 原生全屏事件不冒泡到 document，必须绑定在 video 元素上
  video.addEventListener('webkitenterfullscreen', onFullscreenChange);
  video.addEventListener('webkitexitfullscreen', onFullscreenChange);

  // 鼠标进入/移动播放区域显示控制条，移出后 3 秒隐藏
  playerArea.addEventListener('mouseenter', showControlsAuto);
  playerArea.addEventListener('mousemove', showControlsAuto);
  playerArea.addEventListener('mouseleave', function() {
    if (hideControlsTimer) clearTimeout(hideControlsTimer);
    if (!video.paused) hideControls();
  });
  // 鼠标悬停在控制条上时保持显示
  playerControls.addEventListener('mouseenter', function() {
    if (hideControlsTimer) { clearTimeout(hideControlsTimer); hideControlsTimer = null; }
  });
  playerControls.addEventListener('mouseleave', scheduleHide);
  // 移动端：触摸播放区域显示控制条，3 秒无操作隐藏
  playerArea.addEventListener('touchstart', showControlsAuto, { passive: true });

  /* ===== 播放列表（服务端配置 + 用户自定义） ===== */
  // 从 URL 自动推导播放列表名称：取路径最后一段去掉 .m3u/.m3u8 后缀，失败则用 hostname，再失败截断 URL
  function derivePlaylistName(url) {
    try {
      var u = new URL(url);
      var seg = u.pathname.split('/').filter(Boolean).pop();
      if (seg) return decodeURIComponent(seg.replace(/\.(m3u8?|txt)$/i, ''));
      return u.hostname;
    } catch(e) {
      return url.length > 30 ? url.slice(0, 30) + '…' : url;
    }
  }

  // 将已加载的播放列表加入自定义列表（去重：服务端列表和自定义列表中已存在同 URL 则不添加）
  // url:在线列表为真实 URL;本地上传列表为 'local://' + 时间戳 伪 URL
  // name/content 为可选:本地上传时传入文件名与 M3U 原文
  // 返回 true 表示已加入且持久化成功;false 表示已存在或持久化失败(容量不足)
  function addCustomPlaylist(url, name, content) {
    if (!url) return false;
    var all = serverPlaylists.concat(customPlaylists);
    for (var i = 0; i < all.length; i++) {
      if (all[i].url === url) return false; // 已存在，不重复添加
    }
    var item = { name: name || derivePlaylistName(url), url: url };
    if (content !== undefined) item.content = content;
    customPlaylists.push(item);
    try {
      localStorage.setItem('iptv-custom-playlists', JSON.stringify(customPlaylists));
      return true;
    } catch(e) {
      return false; // 存储空间不足等,当前会话仍可用,刷新后丢失
    }
  }

  // 删除自定义播放列表项（仅允许删自定义项，服务端项不可删）
  function removeCustomPlaylist(url) {
    customPlaylists = customPlaylists.filter(function(p) { return p.url !== url; });
    try {
      localStorage.setItem('iptv-custom-playlists', JSON.stringify(customPlaylists));
      var savedUrl = localStorage.getItem('iptv-playlist-url') || '';
      if (savedUrl === url) {
        localStorage.removeItem('iptv-playlist-url');
        // 删除的是当前正在使用的播放列表,清理频道状态并停止播放
        allChannels = [];
        currentChannel = null;
        currentPlaylistName = '';
        destroyHls();
        try { video.pause(); video.removeAttribute('src'); video.load(); } catch(e) {}
        channelNameOverlay.classList.remove('show');
        if (overlayTimer) { clearTimeout(overlayTimer); overlayTimer = null; }
        renderChannelList();
        setStatus('播放列表已删除', 'status-ok');
      }
    } catch(e) {}
    renderPlaylists();
    setActivePlaylistBtn(urlInput.value.trim());
  }

  function renderPlaylists() {
    if (!serverPlaylists.length && !customPlaylists.length) return;
    playlistWrap.hidden = false;
    playlistWrap.innerHTML = '';
    var title = document.createElement('div');
    title.className = 'playlists-title';
    title.textContent = '播放列表';
    var list = document.createElement('div');
    list.className = 'playlists-list';
    var all = serverPlaylists.concat(customPlaylists);
    all.forEach(function(p) {
      // 判断是否为自定义项（URL 不在服务端列表中即为自定义项，可删除）
      var isCustom = true;
      for (var i = 0; i < serverPlaylists.length; i++) {
        if (serverPlaylists[i].url === p.url) { isCustom = false; break; }
      }
      var item = document.createElement('span');
      item.className = 'playlist-item';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'playlist-btn';
      btn.textContent = p.name;
      btn.setAttribute('data-url', p.url);
      btn.addEventListener('click', function() {
        if (p.url.indexOf('local://') === 0) {
          loadPlaylistFromLocal(p.url, p.name);
        } else {
          urlInput.value = p.url;
          loadPlaylistFromUrl(p.url, p.name);
        }
      });
      item.appendChild(btn);
      if (isCustom) {
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'playlist-del';
        del.title = '删除该自定义播放列表';
        del.textContent = '×';
        del.addEventListener('click', function(e) {
          e.stopPropagation();
          removeCustomPlaylist(p.url);
        });
        item.appendChild(del);
      }
      list.appendChild(item);
    });
    playlistWrap.appendChild(title);
    playlistWrap.appendChild(list);
  }

  // 高亮当前已加载的播放列表按钮（URL不匹配时取消全部高亮）
  function setActivePlaylistBtn(url) {
    var btns = playlistWrap.querySelectorAll('.playlist-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i].getAttribute('data-url') === url);
    }
  }

  /* ===== 初始化 ===== */
  // 优先级：savedUrl > 播放列表第一项（服务端+自定义）；都无则输入框留空，不自动加载
  function initStartup() {
    var savedUrl = '';
    try { savedUrl = localStorage.getItem('iptv-playlist-url') || ''; } catch(e) {}
    var all = serverPlaylists.concat(customPlaylists);
    var defaultUrl = all.length ? all[0].url : '';
    // 恢复优先:上次加载的地址(含本地上传的 local:// 伪 URL);否则取列表第一项
    var target = savedUrl || defaultUrl;
    if (!target) return; // 无任何列表,输入框留空,不自动加载
    if (target.indexOf('local://') === 0) {
      loadPlaylistFromLocal(target, matchPlaylistName(target));
    } else {
      urlInput.value = target;
      loadPlaylistFromUrl(target, matchPlaylistName(target));
    }
  }

  // 启动时先获取服务端配置（播放列表），失败时按空列表初始化
  fetch('/config')
    .then(function(resp) { return resp.json(); })
    .then(function(cfg) {
      if (cfg && Array.isArray(cfg.playlists) && cfg.playlists.length) {
        serverPlaylists = cfg.playlists;
      }
      renderPlaylists();
      initStartup();
    })
    .catch(function() {
      renderPlaylists();
      initStartup();
    });
})();
</script>
</body>
</html>
