name: 自动化构建发布

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: iptv-live

jobs:
  build:
    name: 🐳 Docker 构建 (${{ matrix.arch }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    outputs:
      has_version: ${{ steps.version.outputs.has_version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: � 提取版本号
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          HAS_VERSION=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            HAS_VERSION=true
          else
            TAG_NAME=$(echo "$COMMIT_MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            if [ -n "$TAG_NAME" ]; then
              HAS_VERSION=true
            fi
          fi
          if [ "$HAS_VERSION" = true ]; then
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到版本号: $TAG_NAME"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "has_version=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 未检测到版本号，仅构建不发布"
          fi

      - name: �🔧 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏗️ 构建 ${{ matrix.arch }} 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}:latest
          outputs: type=docker,dest=${{ env.IMAGE_NAME }}-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: 📦 重命名镜像文件（含版本号）
        if: steps.version.outputs.has_version == 'true'
        run: |
          mv "${{ env.IMAGE_NAME }}-${{ matrix.arch }}.tar" "${{ env.IMAGE_NAME }}-${{ matrix.arch }}-${{ steps.version.outputs.tag }}.tar"
          echo "✅ 已重命名: ${{ env.IMAGE_NAME }}-${{ matrix.arch }}-${{ steps.version.outputs.tag }}.tar"

      - name: 📦 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_NAME }}-${{ matrix.arch }}
          path: ${{ env.IMAGE_NAME }}-${{ matrix.arch }}*.tar
          retention-days: 1

  release:
    name: 🚀 发布到 Release
    needs: build
    if: needs.build.outputs.has_version == 'true'
    runs-on: ubuntu-latest

    steps:
      - name:  下载构建产物
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: � 发布到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: IPTV Live ${{ needs.build.outputs.tag }}
          body: |
            IPTV Live ${{ needs.build.outputs.tag }}

            ## 使用方法
            1. 按设备架构下载对应 tar 文件：
               - `iptv-live-amd64-${{ needs.build.outputs.tag }}.tar` — linux/amd64
               - `iptv-live-arm64-${{ needs.build.outputs.tag }}.tar` — linux/arm64
            2. 加载镜像：`docker load -i iptv-live-amd64-${{ needs.build.outputs.tag }}.tar`
            3. 运行容器：`docker run -d -p 8883:8080 iptv-live:latest`
            4. 访问 http://localhost:8883 即可观看
          files: |
            iptv-live-amd64-*.tar
            iptv-live-arm64-*.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}