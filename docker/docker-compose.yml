# IPTV Live - 群晖 Docker Compose 部署配置
# 使用前请先导入 iptv-live:latest 镜像：
#   - 图形界面：Container Manager → 映像 → 导入 → 选择下载的 tar 文件
#   - 命令行：docker load -i iptv-live-amd64-v1.0.0.tar
version: "3.8"

services:
  iptv-live:
    image: iptv-live:latest
    container_name: iptv-live
    # 网络模式：默认 host —— 容器与宿主机共用网络命名空间，不经过端口映射，
    # 应用直接监听宿主机端口（默认 19890），访问 http://<NAS-IP>:19890 即可观看。
    network_mode: host
    # host 模式下 ports 端口映射不生效，故注释掉；如需改访问端口，设置下方 PORT 环境变量。
    # 想改回 bridge（桥接 + 端口映射）时：把上面 network_mode 改为 bridge，并取消下面 ports 注释。
    # ports:
    #   # 端口映射：左侧为 NAS 访问端口（可按需修改），右侧为容器内端口
    #   - "8883:19890"
    environment:
      # 内置播放列表，JSON 数组格式，每项含 name（显示名称）和 url（M3U 地址）
      # 整段用单引号包裹，内部双引号无需转义；可选，不设置则内置列表为空
      PLAYLISTS: '[{"name":"CCTV","url":"https://example.com/cctv.m3u"}]'
      # 监听端口（host 模式下即宿主机端口），默认 19890；如需改访问端口改这里
      # PORT: "19890"
      # 放行内网/保留地址（关闭 SSRF 防护）。默认 false：代理禁止访问内网 IP（如 127.0.0.1、
      # 10.x、172.16-31.x、192.168.x、169.254.x 等），防止恶意 M3U 源探测内网服务。
      # 设为 true 时防护完全关闭，仅建议在受控内网环境使用（如访问同网段 NAS 上的直播源）
      # ALLOW_PRIVATE_NETWORK: "true"
      # 上游 TLS 证书校验：默认 true 跳过校验（兼容自签名源）；设 false 开启严格校验
      # UPSTREAM_TLS_SKIP_VERIFY: "true"
      # 上游请求 User-Agent。默认使用 APTV 真实 UA（AptvPlayer-UA）；如需伪装其它播放器可覆盖，
      # 例如某些源要求 okhttp / OTT / iPhone。留空或不设置则用 APTV 默认。
      # UPSTREAM_UA: "AptvPlayer-UA"
    restart: unless-stopped
    # 应用无持久化数据，无需挂载卷
    # 日志默认输出到 stdout，可通过「docker logs iptv-live」或 Container Manager 日志页查看
    # 如需将日志持久化到 NAS 目录，可取消下方注释
    # volumes:
    #   - ./logs:/app/logs
