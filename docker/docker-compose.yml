# IPTV Live - 群晖 Docker Compose 部署配置
# 使用前请先导入 iptv-live:latest 镜像：
#   - 图形界面：Container Manager → 映像 → 导入 → 选择下载的 tar 文件
#   - 命令行：docker load -i iptv-live-amd64-v1.0.0.tar
version: "3.8"

services:
  iptv-live:
    image: iptv-live:latest
    container_name: iptv-live
    ports:
      # 端口映射：左侧为 NAS 访问端口（可按需修改），右侧为容器内端口
      # 若修改容器内端口，需同步取消下方 PORT 注释并设为相同值
      - "8883:8080"
    environment:
      # 内置播放列表，JSON 数组格式，每项含 name（显示名称）和 url（M3U 地址）
      # 整段用单引号包裹，内部双引号无需转义；不设置则使用默认播放列表
      PLAYLISTS: '[{"name":"IPTV-Global","url":"https://iptv-org.github.io/iptv/index.m3u"}]'
      # 容器内监听端口，默认 8080；修改时需同步上方端口映射右侧的值
      # PORT: "8080"
      # H.265/HEVC 转码（需镜像内含 ffmpeg，默认启用；NAS 无硬解性能不足时可设为 false）
      ENABLE_TRANSCODE: "true"
    restart: unless-stopped
    # 网络模式：bridge（桥接），容器通过端口映射对外提供服务
    network_mode: bridge
    # 应用无持久化数据，无需挂载卷
    # 日志默认输出到 stdout，可通过「docker logs iptv-live」或 Container Manager 日志页查看
    # 如需将日志持久化到 NAS 目录，可取消下方注释
    # volumes:
    #   - ./logs:/app/logs